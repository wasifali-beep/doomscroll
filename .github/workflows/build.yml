# Dev build: runs on every push to main, on pull requests, or by hand.
# Output: debug APK named seekho-v<version>-dev.<run>-debug.apk (Actions artifact, not zipped).
name: Dev build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Work out version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "BUILD=${VERSION}-dev.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Stamp version into app
        run: sed -i "s/__APP_VERSION__/v${BUILD}/g" www/index.html

      - name: Install and prepare Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../seekho-v${BUILD}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: seekho-v${{ env.BUILD }}-debug.apk
          archive: false
          retention-days: 14
