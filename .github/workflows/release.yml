# Release build: runs when you publish a GitHub Release (tag like v1.2.3).
# Output: signed APK seekho-v1.2.3.apk + .sha256, attached to the Release
# and also kept as an Actions artifact.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild, e.g. v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag and version
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3"; exit 1
          fi
          MAJ=${BASH_REMATCH[1]}; MIN=${BASH_REMATCH[2]}; PAT=${BASH_REMATCH[3]}
          VERSION="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::package.json says $PKG but tag says $VERSION. Bump package.json, then tag again."; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MAJ*10000 + MIN*100 + PAT))" >> "$GITHUB_ENV"

      - name: Check signing secrets
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Missing KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets. See docs/RELEASING.md, one-time setup."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Stamp version into app
        run: sed -i "s/__APP_VERSION__/v${VERSION}/g" www/index.html

      - name: Install and prepare Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/; s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/seekho.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/seekho.jks" --ks-key-alias seekho \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out "seekho-${TAG}.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "seekho-${TAG}.apk"
          sha256sum "seekho-${TAG}.apk" > "seekho-${TAG}.apk.sha256"
          rm -f "$RUNNER_TEMP/seekho.jks"

      - name: Attach APK to the GitHub Release
        run: gh release upload "$TAG" "seekho-${TAG}.apk" "seekho-${TAG}.apk.sha256" --clobber

      - name: Fill release notes from CHANGELOG (if empty)
        run: |
          BODY=$(gh release view "$TAG" --json body -q .body)
          if [ -z "$BODY" ]; then
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" {on=1; next}
              on && /^## \[/ {exit}
              on {print}
            ' CHANGELOG.md > notes.md
            if [ -s notes.md ]; then gh release edit "$TAG" --notes-file notes.md; fi
          fi

      - name: Keep APK as Actions artifact too
        uses: actions/upload-artifact@v7
        with:
          path: seekho-${{ env.TAG }}.apk
          archive: false
